# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package in the Python sense, which is what `package = false`
# says -- root/ is installed as-is by the RPM and deb packages. Without a
# lockfile naming mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "claude-agent"
version = "0"
# >=3.10, not >=3.9, and this constrains NOTHING about what the packages
# support: this [project] table exists only so `uv lock` can pin the gate's own
# tools, and the gate runs the image's 3.14. The real compatibility statement is
# `target-version = "py39"` under [tool.ruff], which is what checks the shipped
# code against the oldest interpreter the RPM and deb support. Claiming >=3.9
# here only made uv resolve dev tools against an EOL interpreter.
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

# Lint config for the hooks, the CLI and their tests. This repo is not a
# Python package: root/ is installed as-is by the RPM and deb packages.

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

# The shipped code, by path -- not a package -- and its tests.
[tool.mypy]
files = ["root/usr/libexec/claude-agent", "tests"]

# unittest tests; pytest collects and runs them.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]
