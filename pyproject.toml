# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package in the Python sense, which is what `package = false`
# says -- root/ is installed as-is by the RPM and deb packages. Without a
# lockfile naming mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "claude-agent"
version = "0"
# >=3.10, not >=3.9, and this constrains NOTHING about what the packages
# support: this [project] table exists only so `uv lock` can pin the gate's own
# tools, and the gate runs the image's 3.14. The real compatibility statement is
# `target-version = "py39"` under [tool.ruff], which is what checks the shipped
# code against the oldest interpreter the RPM and deb support. Claiming >=3.9
# here only made uv resolve dev tools against an EOL interpreter.
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

# Lint config for the hooks, the CLI and their tests. This repo is not a
# Python package: root/ is installed as-is by the RPM and deb packages.

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

# The shipped code, by path -- not a package -- and its tests.
[tool.mypy]
files = ["root/usr/libexec/claude-agent", "tests"]

# unittest tests; pytest collects and runs them.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

# The tmux cases of tests/test_supervisor.py and tests/test_cli.py skip in the
# python-sdlc image, which has no tmux; CI runs them, and the pty cases again,
# in an image that has it. root/ is mounted because the tests run the source
# tree's supervisor and CLI.
[tool.sdlc.ci]
checks = ["tmux-image", "tmux-tests"]

# The reference image's own run: `claude-agent status` exits 0 in the image
# built from the root Containerfile, or the build is broken. A hard gate, as
# packages.yml's `podman run --rm` of it was, not the default advisory one.
[tool.sdlc.ci.container-smoke]
gate = true

[tool.sdlc.ci.tmux-image]
kind = "image-build"
containerfile = "tests/tmux/Containerfile"
context = "tests/tmux"
tag = "localhost/claude-agent-tmux:sdlc"

[tool.sdlc.ci.tmux-tests]
kind = "pytest-in-image"
image = "localhost/claude-agent-tmux:sdlc"
tests = ["tests/test_supervisor.py", "tests/test_cli.py"]
mounts = ["tests", "root"]

[tool.sdlc]
repo-kinds = ["autonomous-agent"]
# The root Containerfile is the reference image. A python repo runs the python
# stack alone unless it names more, so without this nothing builds, smokes or
# scans it in `sdlc ci`.
stacks = ["container"]

# A reference image, not one crunchtools publishes: `sdlc ci` builds, smokes and
# scans it on every check event, and nothing pushes, promotes or polls its parent.
[tool.sdlc.image]
publish = false
