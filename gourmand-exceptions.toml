[[exceptions]]
check = "CH024-print_only_server_logging"
path = "root/usr/libexec/claude-agent/hooks.py"
justification = "A hook is a short-lived command, not a server: Claude Code shows its stderr and decides what to do from its exit code and stdout. Usage, a breaker failure and a missed supervisor event are each one line to stderr; a logging framework would add configuration with nothing to configure."
classification = "by_design"

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"

# _tighten() reports and continues, and both halves are deliberate.
#
# It must not raise: this runs on the audit write path, and an audit record is
# worth more than its permission bits -- failing the hook over a chmod would
# lose the record we are trying to protect. It must not be silent either: a
# permission we believe we set and did not is precisely what should never pass
# unnoticed, which is the whole point of the change that added it.
#
# Gourmand's EV004 accepts neither "pass" nor "print and continue". There is no
# third option here that is better than this one.
[[exceptions]]
check = "EV004-redundant_error_handling"
path = "root/usr/libexec/claude-agent/hooks.py"
pattern = "could not tighten"
justification = "Reporting and continuing is the correct behaviour on the audit write path: raising would lose an audit record over a permission bit, and swallowing would hide a security property we failed to set. The handler prints to stderr, which is how this module already reports the breaker and event failures below it."
classification = "by_design"

# EV009 says `exc` is never used in the handler body. It is used, on the very
# next line: `print(f"hooks.py audit: could not tighten {path}: {exc!r}", ...)`.
# The check does not look inside the nested `with contextlib.suppress(OSError):`
# that the use sits in, and that nesting is not decoration -- without it a
# BrokenPipeError from print() escapes the handler and takes down the audit
# write. Removing the `with` to satisfy the check would reintroduce the bug
# Gatehouse found on this pull request.
[[exceptions]]
check = "EV009-discarded_errors"
path = "root/usr/libexec/claude-agent/hooks.py"
pattern = "could not tighten"
justification = "The caught exception IS used, in the f-string one line below, inside a `with contextlib.suppress(OSError)` block that the check does not descend into. The suppression is required: print() to a closed stderr raises BrokenPipeError, an OSError, which would otherwise escape this handler and break the audit write."
classification = "gourmand_bug"
