# Gourmand exceptions. Each entry is a finding reviewed by hand and kept on
# purpose; the justification says why.

[[exceptions]]
check = "CH009-random_scripts"
path = "root/usr/libexec/claude-agent/hooks.py"
justification = "root/ is the package install tree (packaging/files.txt maps each file to its package), so a file's path here is its install path. hooks.py is the breaker and audit hook that the managed-settings fragment runs on every tool call, installed under libexec because nothing calls it by hand. Documented in docs/controls.md; covered by tests/test_hooks.py."
classification = "by_design"

