# The repo's own checks, from python-sdlc at the release .pre-commit-config.yaml
# pins -- the same image and the same commands the laptop runs, so a green push
# predicts a green CI (constitution XII, v1.30.0).
#
# NOT every check on this pull request: Gourmand and Gatehouse run as their own
# workflows, which is why `sdlc ci` leaves them out (XII: "CI runs push's checks
# except Gourmand and Gatehouse, which CI runs through their own workflows").
#
# The job NAME `sdlc ci` is the required check in the org ruleset "Python SDLC
# gates". Renaming the job stops it gating, silently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdlc:
    name: sdlc ci
    runs-on: ubuntu-latest
    # The job this replaced carried `timeout-minutes: 10`. Dropping it would let
    # a hung check -- CodeQL, or a network call inside the image -- hold a
    # runner until GitHub's six-hour default. 20 is roughly twice the observed
    # run, which is the headroom a flaky network needs without the six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .sdlc/bin/sdlc asks the image for its own launcher, so the launcher, the
      # image and every tool float together. SDLC_IMAGE comes only from the
      # repository variable (latest when unset; main, X.Y.Z or @sha256:<digest>).
      - name: sdlc ci
        env:
          SDLC_IMAGE: ${{ vars.SDLC_IMAGE }}
        run: .sdlc/bin/sdlc ci
