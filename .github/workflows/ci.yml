name: CI

# Lint and unit tests on the oldest Python the packages support and on a
# current one. The packages themselves are built and installed in
# packages.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: pipx run ruff==0.14.11 check .

      - name: Tests
        run: python -m unittest discover -s tests -v
